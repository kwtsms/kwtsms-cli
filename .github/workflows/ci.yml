name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Vet
        run: go vet ./...

      # 2026-11-05 09:39 +03: test number from the repo secret; tests that need it skip when unset (int-testnumber).
      - name: Test
        env:
          KWTSMS_TEST_NUMBER: ${{ secrets.KWTSMS_TEST_NUMBER }}
        run: go test ./...

      - name: Build
        run: CGO_ENABLED=0 go build -o kwtsms-cli .
