name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: stable

      - name: Vet
        run: go vet ./...

      # 2026-11-05 09:39 +03: test number from the repo secret; tests that need it skip when unset (int-testnumber).
      - name: Test
        env:
          KWTSMS_TEST_NUMBER: ${{ secrets.KWTSMS_TEST_NUMBER }}
        run: go test ./...

      - name: Build
        run: CGO_ENABLED=0 go build -o kwtsms-cli .
