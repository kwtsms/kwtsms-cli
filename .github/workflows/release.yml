name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    # CGO_ENABLED=0 ensures pure Go builds, allowing a single Linux runner
    # to cross-compile for all 6 targets including macOS and Windows.
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset: kwtsms-cli-linux-x64
          - goos: linux
            goarch: arm64
            asset: kwtsms-cli-linux-arm64
          - goos: linux
            goarch: arm
            goarm: "7"
            asset: kwtsms-cli-linux-armv7
          - goos: darwin
            goarch: amd64
            asset: kwtsms-cli-macos-x64
          - goos: darwin
            goarch: arm64
            asset: kwtsms-cli-macos-arm64
          - goos: windows
            goarch: amd64
            asset: kwtsms-cli-windows-x64.exe

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
          ASSET_NAME: ${{ matrix.asset }}
        run: go build -ldflags="-s -w -X github.com/kwtsms/kwtsms-cli/cmd.version=${GITHUB_REF_NAME}" -o "$ASSET_NAME" .

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: "kwtsms-cli-*"
          generate_release_notes: true
